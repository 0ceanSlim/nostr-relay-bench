name = "gc_index_relay (Mercury)"
scored = "2026-11-19"
summary = "Elixir/Phoenix on Postgres + Apache AGE. GitCitadel's publication/wiki index: writes through a REST API, read-only NIP-01 WebSocket serving corpus kinds 30023/30040/30041/30817/30818. NIPs 1,11,70 (+09 via REST)."

