name = "vespa-relay"
scored = "2026-11-19"
summary = "Kotlin/quartz on Vespa, MIT. WoT-ranked search relay. Reads need observer: lens or AUTH by default. NIPs 1,9,11,40,42,45,50,62,77(+86)."

