[evidence]
auth = "NIP-42 handled by khatru but never requested or required; no restricted reads, kind 1059 served to anyone (main.go)."
write_policy = "Writes only from pubkeys in the computed trust network, kind 4 rejected, base64 media rejected (main.go OnEvent); master adds zap receipts for a NIP-75 funding goal (funding.go)."
admission = "Web of trust from the owner's follows with MINIMUM_FOLLOWERS, IGNORE_FOLLOWS_LIST; master adds a monthly NIP-75 zap funding goal. The gate accepts everything while the trust map is empty."
rate_limits = "EventIPRateLimiter 5/min, FilterIPRateLimiter 5/min, ConnectionRateLimiter 10/2min, all hard-coded in main.go; no per-pubkey limits."
