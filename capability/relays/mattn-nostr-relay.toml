[evidence]
auth = "NIP-42 via relayer; REQs naming kind 4 or 1059 need AUTH as the party, but a filter without kinds returns them to anyone (relayer handlers.go validateFilterAccess)."
write_policy = "pubkey allowlist/blocklist tables, NIP-13 min-pow flag, NIP-26 delegation and NIP-65 shape checks, fixed 16384-byte content cap (relay.go AcceptEvent). No kind rules or scripting."
admission = "allowlist table: when non-empty only listed pubkeys may write. No WoT, invites or payments."
rate_limits = "One 5 msg/s per-connection limiter, burst 1, hardcoded (main.go WithPerConnectionLimiter(5.0, 1)); it delays rather than rejects. No per-IP, per-pubkey or per-kind limits."
negentropy = "NIP-77 handled generically by relayer v2.3.1 (nip77.go); not advertised in supported_nips, no settings."
retention = "Expired NIP-40 events are skipped (skipEventFunc); no age, size or kind purge."
deployment = "Static single binary in a scratch image published to ghcr.io per tag; SQLite by default, Postgres/MySQL/Turso/OpenSearch/Firestore by flag; k8s manifest."
backup = "Shipped compose replicates the SQLite file with Litestream; no export/import command."
multi_role = "One relay per process."
count = "NIP-45 COUNT delegated to the eventstore backend (relay.go CountEvents), exact."
search = "NIP-50 via the backend (Postgres ILIKE substring, OpenSearch) or an external CUSTOM_SEARCH_URL; no index of its own for SQLite."
protected_vanish = "NIP-70 enforced (relay.go nip70.IsProtected); no NIP-62."
groups = "No NIP-29 or NIP-43."
admin_ui = "No admin UI; /reload re-reads the allow/block tables and is unauthenticated, as is /gc."
moderation = "Bans are rows in the blocklist table edited in SQL, then /reload. No NIP-86 or NIP-56."
observability = "Prometheus /metrics (Go runtime counters), JSON slog with LOG_LEVEL, /info with event count, optional pprof."
maturity = "Since 2023-03, 621 commits (60 in the last 90 days), tags up to v0.0.270; built-in NIP-11 points at the author's relay (nostr.compile-error.net)."
blossom = "No Blossom server."
