# Every relay implementation we know of. tier: active / slowing / dormant are from Vitor's
# 19 Nov 2026 commit survey; missed = not in it. id links to capability/relays/<id>.toml
# and relays/<id>/ when the relay is scored or benchmarked. Add yours with a PR.

[[relay]]
name = "vespa-relay"
id = "vespa-relay"
tier = "active"
repo = "https://github.com/NosFabrica/vespa-relay"
language = "Kotlin"
storage = "Vespa"
about = "Search relay that ranks every read through the reader's web of trust; built on Amethyst's quartz"
notes = "Reads need an observer: lens or AUTH by default; Vespa wants ~34 GB"

