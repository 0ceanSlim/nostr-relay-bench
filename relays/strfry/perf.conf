# strfry perf profile: limits raised so the load generator is the bottleneck, gift wraps and DMs
# readable without AUTH, compression off. Every key is present because strfry refuses a config
# that omits one.
db = "/data/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = true
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 524288
    realIpHeader = ""

    info {
        name = "strfry"
        description = "nostr-relay-bench instance"
        pubkey = ""
        contact = ""
        icon = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 262144
    maxReqFilterSize = 50
    autoPingSeconds = 55
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 5000
    maxSubsPerConnection = 200

    writePolicy {
        plugin = ""
        rejectedKinds = ""
    }

    auth {
        # enabled = false would leave the default read restriction on 1059/4 in place with no
        # way to satisfy it; the kinds list is the control.
        enabled = true
        restrictedReadKinds = ""
    }

    compression {
        enabled = false
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}
