# TLS-terminating proxy stand-in. The prod release is compiled with force_ssl
# (config/prod.exs), so plain http:// to any host but localhost gets a 301 to https://.
# Upstream deploys it behind a TLS proxy; this one forwards X-Forwarded-Proto: https, which
# Plug.SSL's rewrite_on honours, and passes WebSocket upgrades through.
worker_processes auto;
worker_rlimit_nofile 1048576;
events { worker_connections 65536; }
http {
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 4000;
    location / {
      proxy_pass http://mercury:4000;
      proxy_http_version 1.1;
      proxy_set_header Host relay;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }
}
