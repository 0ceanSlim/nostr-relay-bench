name = "gc_index_relay (Mercury)"
repo = "https://git.imwald.eu/silberengel/gc_index_relay"
git = "https://git.imwald.eu/silberengel/gc_index_relay.git"
track = "branch:master"   # no tags; HEAD points at test/local-setup, which master contains plus newer commits
port = 4000
private_giftwraps = false
disabled = true          # an index relay: read-only WebSocket for a few long-form kinds, so a write-heavy bench measures nothing; scored for capability only
notes = "Fronted by an nginx stand-in for a TLS proxy that sends X-Forwarded-Proto: https: the prod release is compiled with force_ssl and answers plain http with a 301 to https://. Read-only over WebSocket: EVENT is always answered OK false (writes go through POST /api/events), and REQs serve only the corpus kinds 30023/30040/30041/30817/30818 with limit capped at 100. Kinds, the cap and read-only are hardcoded, so the perf and default profiles are the same stack. Upstream compose.yaml stack (Apache AGE Postgres, user setup, migrator, server) built from docker/server.Dockerfile, with SECRET_KEY_BASE left at compose's dev default."
