# nostream as its own docker-compose.yml runs it: the relay built from upstream's Dockerfile at the
# resolved tag, Postgres 15 with upstream's postgresql.conf, Redis 7 with a password. Left out:
# the otel collector, Prometheus and Grafana (optional observability) and the Tor/I2P overlays.
# Changes from upstream: a fixed throwaway SECRET, migrations run in the relay container before it starts (upstream uses a
# separate one-shot container), and data lives in named volumes. Default profile = the image's
# default-settings.yaml with no overrides.
x-ref: &ctx "https://github.com/cameri/nostream.git#${REF}"
services:
  relay:
    build: { context: *ctx }
    entrypoint: ["/bin/sh", "-c", "node_modules/.bin/knex migrate:latest && exec node src/index.js"]
    environment:
      # Required: every EVENT fails with "SECRET environment variable not set" without it (the
      # relay derives its own key from it). Fixed throwaway value; upstream's setup generates one.
      SECRET: nostr-relay-bench-throwaway-secret-0123456789abcdef0123456789abcdef
      RELAY_PORT: 8008
      NOSTR_CONFIG_DIR: /home/node/.nostr
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: nostr_ts_relay
      DB_PASSWORD: nostr_ts_relay
      DB_NAME: nostr_ts_relay
      DB_MIN_POOL_SIZE: 16
      DB_MAX_POOL_SIZE: 64
      DB_ACQUIRE_CONNECTION_TIMEOUT: 60000
      READ_REPLICA_ENABLED: "false"
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_USER: default
      REDIS_PASSWORD: nostr_ts_relay
    user: node:node
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }
    cpuset: "${RELAY_CPUS}"
    ulimits: { nofile: 1048576 }
    networks: { relaybench: { aliases: [relay] } }
  db:
    build:
      context: *ctx
      dockerfile_inline: |
        FROM postgres:15
        COPY postgresql.conf /postgresql.conf
    command: postgres -c config_file=/postgresql.conf
    environment:
      POSTGRES_DB: nostr_ts_relay
      POSTGRES_USER: nostr_ts_relay
      POSTGRES_PASSWORD: nostr_ts_relay
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nostr_ts_relay"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 360s
    cpuset: "${RELAY_CPUS}"
    networks: [relaybench]
  cache:
    image: redis:7.0.5-alpine3.16
    command: redis-server --loglevel warning --requirepass nostr_ts_relay
    volumes: [cache:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "nostr_ts_relay", "ping"]
      interval: 1s
      timeout: 5s
      retries: 5
    cpuset: "${RELAY_CPUS}"
    networks: [relaybench]
volumes: { pgdata: {}, cache: {} }
networks: { relaybench: { external: true, name: "${RB_NET:-relaybench}" } }
